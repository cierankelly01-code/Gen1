# Security headers for every response. nginx drops server-level add_header lines
# inside any location that has its own add_header, so this file is included in
# the server block AND in each location that sets headers.
#
# CSP: scripts only from this site, plus the one inline theme snippet pinned by hash,
# plus two addresses on our own visit-statistics server (Umami on clients1): the counting script and the
# address it reports to. If STATS_URL changes, change it here twice; the Docker build refuses a mismatch.
# If that snippet in site/_src/partials/layout.html changes, update the hash
# (python site/build.py prints nothing for it; recompute with the one-liner in SECURITY-POSTURE.md).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-aqCakkojRejwtIwRUsy2EoyVmSobba2xKP2vL/ZPbzk=' https://stats.5.222.15.118.sslip.io/script.js; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co https://stats.5.222.15.118.sslip.io/api/send; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
