# Genex website checks: run on every push and pull request.
# Actions are pinned to full commit SHAs (tag in the trailing comment), as in factory-os.
# No secrets are used; the token can only read code.
name: Site checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Build, links, SEO basics, private-file guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Rebuild pages from _src
        run: cd site && python build.py
      - name: Built pages must match their sources (edit _src, then run build.py)
        run: git diff --exit-code -- site/*.html
      - name: Preview build (noindex, robots blocked)
        run: cd site && python make_preview.py
      - name: Links, anchors, titles, JSON-LD, sitemap, private files
        run: python tools/check_site.py
      - name: Form database rules and enquiry emails (real Postgres rules in PGlite, fake email provider)
        working-directory: supabase
        run: npm ci --no-audit --no-fund && npm test
      - name: Live build path works, and refuses to build without a form backend
        run: |
          docker build --build-arg PREVIEW=0 --build-arg SUPABASE_URL=https://ci-example.supabase.co --build-arg SUPABASE_ANON_KEY=ci-placeholder --build-arg STATS_URL=https://stats.5.222.15.118.sslip.io --build-arg STATS_ID=ci-site-id -t genex-site-ci .
          docker run -d --rm --name genex-site-ci -p 8089:80 genex-site-ci
          curl -sf --retry 15 --retry-delay 1 --retry-all-errors http://127.0.0.1:8089/ > /tmp/home.html
          if grep -qi 'noindex' /tmp/home.html; then echo "live build is marked noindex"; exit 1; fi
          curl -sf http://127.0.0.1:8089/assets/js/config.js | grep -q 'demo: false'
          curl -sf http://127.0.0.1:8089/assets/js/config.js | grep -q "stats: { url: 'https://stats.5.222.15.118.sslip.io', id: 'ci-site-id' }"
          curl -sf http://127.0.0.1:8089/assets/js/site.js | grep -q "dataset.websiteId"
          curl -sI http://127.0.0.1:8089/ | grep -i content-security-policy | grep -q "https://stats.5.222.15.118.sslip.io/script.js"
          if curl -sf http://127.0.0.1:8089/privacy.html | grep -qi "don't currently use cookies or analytics"; then echo "privacy page still says no analytics"; exit 1; fi
          curl -sf http://127.0.0.1:8089/concern.html | grep -q 'Send to our quality team'
          docker stop genex-site-ci
          if docker build --build-arg PREVIEW=0 -t genex-site-ci-nobackend . ; then echo "live build without a backend should have failed"; exit 1; fi
      - name: Statistics never count on a preview, and a bad stats setting stops the build
        run: |
          docker build --build-arg PREVIEW=1 --build-arg STATS_URL=https://stats.5.222.15.118.sslip.io --build-arg STATS_ID=ci-site-id -t genex-site-ci-preview .
          docker run --rm genex-site-ci-preview cat /usr/share/nginx/html/assets/js/config.js | grep -q "stats: { url: '', id: '' }"
          B="--build-arg PREVIEW=0 --build-arg SUPABASE_URL=https://ci-example.supabase.co --build-arg SUPABASE_ANON_KEY=ci-placeholder"
          if docker build $B --build-arg STATS_URL=https://not-allowed.example --build-arg STATS_ID=ci-site-id -t genex-site-ci-bad . ; then echo "a stats address outside the security policy should have failed"; exit 1; fi
          if docker build $B --build-arg STATS_URL=https://stats.5.222.15.118.sslip.io --build-arg "STATS_ID=a'b" -t genex-site-ci-bad . ; then echo "a stats id with a quote should have failed"; exit 1; fi
      - name: nginx config is valid (redirects, headers)
        run: >
          docker run --rm
          -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
          -v "$PWD/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro"
          nginx:1.27-alpine nginx -t

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.30.1 (checksum verified)
        working-directory: ${{ runner.temp }}
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$file" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${file}"
          echo "${GITLEAKS_SHA256}  ${file}" | sha256sum -c -
          tar -xzf "$file" gitleaks
      - name: Scan every commit for keys, tokens and passwords
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .'
