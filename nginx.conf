server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain application/xml;

  location / { try_files $uri $uri/ =404; }
  # scripts and styles change between deploys: revalidate; images/fonts can cache longer
  location ~* \.(js|css)$ { expires 1h; add_header Cache-Control "public, must-revalidate"; }
  location /assets/img/ { expires 30d; add_header Cache-Control "public"; }
  location = /assets/js/config.js { expires -1; add_header Cache-Control "no-store"; }
  error_page 404 /404.html;
}
