server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;                      # don't advertise the nginx version
  client_max_body_size 1k;                # static site: nothing should be uploaded here
  include /etc/nginx/snippets/security-headers.conf;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain application/xml;

  # Read-only site: only GET and HEAD
  if ($request_method !~ ^(GET|HEAD)$) { return 405; }

  # Never serve dotfiles, sources or build scripts, even if one slips into the image
  location ~ /\.(?!well-known) { deny all; return 404; }
  location ~* \.(py|sql|md|env|bak|orig|log|sh)$ { deny all; return 404; }
  location ^~ /assets/img/src/ { deny all; return 404; }

  # v3 (Oct 2026): Genex are not toolmakers, so the tooling pages were retired; send old links somewhere useful
  location = /press-tooling.html { return 301 /capabilities.html#pressings; }
  location = /export-dies.html { return 301 /capabilities.html; }
  location = /global.html { return 301 /industries.html; }
  location = /pressing-design-guide.html { return 301 /design-guide.html; }

  location / { try_files $uri $uri/ =404; }
  # scripts and styles change between deploys: revalidate; images/fonts can cache longer
  location ~* \.(js|css)$ {
    expires 1h; add_header Cache-Control "public, must-revalidate";
    include /etc/nginx/snippets/security-headers.conf;
  }
  location /assets/img/ {
    expires 30d; add_header Cache-Control "public";
    include /etc/nginx/snippets/security-headers.conf;
  }
  location = /assets/js/config.js {
    expires -1; add_header Cache-Control "no-store";
    include /etc/nginx/snippets/security-headers.conf;
  }
  location /assets/video/ {
    expires 30d; add_header Cache-Control "public";
    include /etc/nginx/snippets/security-headers.conf;
  }
  error_page 404 /404.html;
}
